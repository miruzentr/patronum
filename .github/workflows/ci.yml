name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python3 -m py_compile patronum.py
      - name: Run tests
        run: python3 test_patronum.py -v
      - name: Smoke test (dns + port)
        run: |
          python3 patronum.py dns github.com
          python3 patronum.py port github.com 443
